# Local, reproducible WooCommerce store for the connector.
#   https://localhost:8443  -> nginx (TLS + rate limit) -> WordPress/WooCommerce
# `make up` brings it up, `make seed` installs WooCommerce + fake data + a read-only API key.
name: woo-agent-bridge

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress        # local demo only
      MARIADB_ROOT_PASSWORD: rootpass    # local demo only
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    depends_on:
      db: { condition: service_healthy }
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # nginx terminates TLS. Tell WordPress the request was HTTPS, otherwise WooCommerce
      # refuses Basic auth with consumer key/secret (the classic "401 on localhost" gotcha).
      WORDPRESS_CONFIG_EXTRA: |
        if (($$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('WP_HOME', 'https://localhost:8443');
        define('WP_SITEURL', 'https://localhost:8443');
    volumes: [wp:/var/www/html]

  # One-shot: self-signed cert for localhost (written to ./docker/certs, git-ignored).
  certs:
    image: alpine:3.20
    volumes: [./docker/certs:/certs]
    command: >
      sh -c "[ -f /certs/localhost.pem ] || (apk add --no-cache openssl >/dev/null &&
      openssl req -x509 -newkey rsa:2048 -nodes -days 825 -subj '/CN=localhost'
      -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      -addext 'basicConstraints=critical,CA:TRUE'
      -keyout /certs/localhost.key -out /certs/localhost.pem)"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      wordpress: { condition: service_started }
      certs: { condition: service_completed_successfully }
    ports: ["8443:443"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro

  # One-shot seeder, run via `make seed` (profile keeps it out of `up`).
  wpcli:
    image: wordpress:cli-2.12.0-php8.3
    profiles: [tools]
    user: "33:33"                         # same uid as the apache image, so plugin files are writable
    depends_on:
      db: { condition: service_healthy }
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      HOME: /tmp
    volumes:
      - wp:/var/www/html
      - ./docker/seed:/seed:ro
      - ./docker/out:/out
    entrypoint: ["sh", "/seed/seed.sh"]

volumes:
  db:
  wp:

# TLS in front of WordPress + a deliberately tight API rate limit, so the connector's
# 429 handling is exercised against a real server, not just mocks.
limit_req_zone $binary_remote_addr zone=wcapi:10m rate=5r/s;

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    location /wp-json/ {
        limit_req zone=wcapi burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @ratelimited;
        proxy_pass http://wordpress:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location @ratelimited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"code":"rate_limited","message":"Too many requests"}';
    }
}
